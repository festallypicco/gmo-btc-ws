x-app-image: &app-image
  build: .
  image: gmo-btc-ws:latest

services:
  engine:
    <<: *app-image
    container_name: btc-engine
    # Persist stdout/stderr under bind-mounted /app/log (host: log/)
    # as engine_YYYY-MM-DD.log / engine_YYYY-MM-DD.err.log (same as native).
    command: python -u scripts/run_engine_with_file_logs.py
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./log:/app/log
      - ./runtime:/app/runtime
    restart: on-failure:5
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    <<: *app-image
    container_name: btc-dashboard
    command: streamlit run btc_trading_tool/dashboard.py --server.port=8501 --server.address=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./log:/app/log
      - ./runtime:/app/runtime
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - engine
    restart: on-failure:5

  ai_review:
    <<: *app-image
    container_name: btc-ai-review
    env_file:
      - ai_review/.env
    volumes:
      - ./config:/app/config
      - ./log:/app/log
      - ./runtime:/app/runtime
    restart: "no"
    profiles:
      - manual
